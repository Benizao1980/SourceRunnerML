name: Tutorial smoke test

on:
  push:
    branches: [main]
    paths:
      - "docs/tutorial.md"
      - "examples/toy_quickstart/**"
      - "scripts/sourcerunner_full_validation.py"
      - "scripts/source_runner_preflight.py"
      - "requirements-minimal.txt"
      - "tests/test_toy_quickstart.py"
      - "tests/test_validation_features.py"
      - "tests/test_optional_tuning.py"
      - "scripts/sourcerunner_tuning.py"
      - "scripts/sourcerunner_validation.py"
      - "tests/test_grouped_validation.py"
      - "examples/tuning.example.json"
      - "scripts/sourcerunner_features.py"
      - ".github/workflows/tutorial-smoke.yml"
  pull_request:
    paths:
      - "docs/tutorial.md"
      - "examples/toy_quickstart/**"
      - "scripts/sourcerunner_full_validation.py"
      - "scripts/source_runner_preflight.py"
      - "requirements-minimal.txt"
      - "tests/test_toy_quickstart.py"
      - "tests/test_validation_features.py"
      - "tests/test_optional_tuning.py"
      - "scripts/sourcerunner_tuning.py"
      - "scripts/sourcerunner_validation.py"
      - "tests/test_grouped_validation.py"
      - "examples/tuning.example.json"
      - "scripts/sourcerunner_features.py"
      - ".github/workflows/tutorial-smoke.yml"

jobs:
  toy-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal stack
        run: python -m pip install -r requirements-minimal.txt
      - name: Check synthetic table generator
        run: python -m unittest discover -s tests -p 'test_toy_quickstart.py' -v
      - name: Check fold-safe preprocessing and feature selection
        run: python -m unittest discover -s tests -p 'test_validation_features.py' -v
      - name: Test optional tuning on small partitions
        run: python -m unittest discover -s tests -p 'test_optional_tuning.py' -v
      - name: Check grouped outer/inner validation and CV-only boundary
        run: python -m unittest discover -s tests -p 'test_grouped_validation.py' -v
      - name: Generate and inspect toy data
        run: |
          python examples/toy_quickstart/make_toy_data.py --outdir toy_data
          python scripts/source_runner_preflight.py \
            --train toy_data/train.tsv \
            --predict toy_data/predict.tsv \
            --source_col source \
            --id_col id \
            --min_source_size 20 \
            --loci_pattern '^CAMP' \
            --outdir toy_preflight
      - name: Tiny end-to-end run
        run: |
          python scripts/sourcerunner_full_validation.py \
            --train_file toy_data/train.tsv \
            --predict_file toy_data/predict.tsv \
            --output_dir toy_results \
            --run_name ci_toy \
            --source_col source \
            --keep_sources Poultry,Ruminant,Pig \
            --loci_prefix CAMP \
            --models random_forest,logreg \
            --cv_folds 2 \
            --bootstrap 2 \
            --burn_in 0 \
            --pred_bootstrap 2 \
            --max_train_rows 90 \
            --max_predict_rows 12 \
            --cpus 2
      - name: Check expected output files
        run: |
          python - <<'PY'
          import glob
          from pathlib import Path
          matches = glob.glob("toy_results/ci_toy_*/model_comparison_cv_summary.tsv")
          assert len(matches) == 1, matches
          import csv
          with open(matches[0], newline="") as handle:
              rows = list(csv.DictReader(handle, delimiter="\t"))
          assert {r["model"] for r in rows if r["status"] == "ok"} >= {"random_forest", "logreg"}, rows
          out = Path(matches[0]).parent
          for expected in ["run_setup.json", "bootstrap_oob_metrics_all_replicates.tsv",
                           "human_predictions_bootstrap_ensemble.tsv", "prediction_probability_means.tsv"]:
              assert (out / expected).is_file(), expected
          # Independent downstream loading must not require importing custom project modules.
          import pickle, pandas as pd
          with open(out / "final_model_fit_all_training.pkl", "rb") as handle:
              fitted = pickle.load(handle)
          assert {"model", "loci", "imputer", "label_encoder"} <= set(fitted)
          raw = pd.read_csv("toy_data/predict.tsv", sep="\t")
          alleles = raw[fitted["loci"]].apply(pd.to_numeric, errors="coerce")
          probs = fitted["model"].predict_proba(fitted["imputer"].transform(alleles))
          assert probs.shape[0] == len(raw)
          print("All expected toy outputs exist; saved model is portable.")
          PY

      - name: Simulate an organism-specific locus list
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p = Path("toy_data")
          names = []
          for name in ("train.tsv", "predict.tsv"):
              df = pd.read_csv(p / name, sep="\t", dtype=str)
              rename = {c: ("SAL_" if int(c[4:]) % 2 else "cg_") + c[4:] for c in df if c.startswith("CAMP")}
              names = list(rename.values())
              df.rename(columns=rename).to_csv(p / ("salmonella_" + name), sep="\t", index=False)
          (p / "salmonella_loci.txt").write_text("locus\n" + "\n".join(names) + "\n")
          PY
          python scripts/source_runner_preflight.py \
            --train toy_data/salmonella_train.tsv \
            --predict toy_data/salmonella_predict.tsv \
            --source_col source --loci_file toy_data/salmonella_loci.txt \
            --min_source_size 20 --outdir salmonella_preflight
          python scripts/sourcerunner_full_validation.py \
            --train_file toy_data/salmonella_train.tsv \
            --predict_file toy_data/salmonella_predict.tsv \
            --output_dir salmonella_smoke --run_name multi_scheme \
            --source_col source --keep_sources Poultry,Ruminant,Pig \
            --loci_file toy_data/salmonella_loci.txt \
            --models random_forest --cv_folds 2 --bootstrap 2 \
            --burn_in 0 --pred_bootstrap 2 --max_train_rows 90 \
            --max_predict_rows 12 --cpus 2
      - name: Verify Salmonella-mode selected loci and probabilities
        run: |
          python - <<'PY'
          import glob, json, pandas as pd
          from pathlib import Path
          directory = Path(glob.glob("salmonella_smoke/multi_scheme_*/run_setup.json")[0]).parent
          setup = json.loads((directory / "run_setup.json").read_text())
          assert setup["locus_selection_method"] == "file"
          assert setup["loci_retained"] > 0
          assert len((directory / "retained_loci_final.txt").read_text().splitlines()) == setup["loci_retained"]
          assert (directory / "cv_fold_retained_loci__random_forest.tsv").exists()
          df = pd.read_csv(directory / "human_predictions_bootstrap_ensemble.tsv", sep="\t")
          probabilities = df.filter(regex=r"^prob_mean_")
          assert len(probabilities.columns) == 3
          assert (probabilities.sum(axis=1) - 1).abs().max() < 1e-6
          PY

      - name: Exercise optional tuning without leakage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("toy_data/tiny_tune.json").write_text(
              json.dumps({"random_forest": {"n_estimators": [10, 20], "max_depth": [None, 4]}})
          )
          PY
          python scripts/sourcerunner_full_validation.py \
            --train_file toy_data/train.tsv \
            --predict_file toy_data/predict.tsv \
            --output_dir tuning_smoke --run_name nested_grid \
            --source_col source --keep_sources Poultry,Ruminant,Pig \
            --loci_prefix CAMP --models random_forest \
            --tuning_config toy_data/tiny_tune.json --inner_cv_folds 2 \
            --cv_folds 2 --bootstrap 2 --burn_in 0 --pred_bootstrap 2 \
            --max_train_rows 90 --max_predict_rows 12 --cpus 2
          python - <<'PY'
          import glob, json, pandas as pd
          from pathlib import Path
          folder = Path(glob.glob("tuning_smoke/nested_grid_*/final_model_tuning.json")[0]).parent
          t = json.loads((folder / "final_model_tuning.json").read_text())
          assert t["tuned"] and t["candidates"] == 4, t
          folds = pd.read_csv(folder / "cv_fold_retained_loci__random_forest.tsv", sep="\t")
          assert folds["tuning"].str.contains('"tuned": true').all()
          metrics = pd.read_csv(folder / "bootstrap_oob_metrics_all_replicates.tsv", sep="\t")
          assert metrics["tuning"].str.contains('"tuned": true').all()
          print("Inner-fold and in-bag tuning smoke test passed")
          PY
